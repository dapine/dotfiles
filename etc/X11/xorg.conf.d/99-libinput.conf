Section "InputClass"
    Identifier "libinput touchpad config"
    MatchIsTouchpad "on"
    Driver "libinput"
    
    # Basic input settings
    Option "NaturalScrolling" "false"     # Set to "true" if you prefer "natural" scrolling
    Option "ScrollMethod" "twofinger"      # Using two fingers to scroll (more intuitive than edge)
    
    # Tapping configuration
    Option "Tapping" "on"                  # Enable tap-to-click
    Option "TappingButtonMap" "lrm"        # 1 finger = left, 2 fingers = right, 3 = middle
    Option "TappingDrag" "on"               # Enable tap-and-drag
    
    # Click behavior - USING CLICKFINGER (recommended for modern ThinkPads)
    Option "ClickMethod" "clickfinger"      # Click with 1/2/3 fingers for left/right/middle
    
    # Palm rejection and typing
    Option "DisableWhileTyping" "on"        # Prevent palm touches while typing

    Option "AccelProfile" "adaptive"
    
    # Optional: Adjust cursor speed (1.0 is default, higher = faster)
    Option "AccelSpeed" "0.1"
    
    # Optional: Adjust touchpad sensitivity (0-1, default is usually good)
    # Option "Touchpad Pressure" "30"
    
    # Disable when mouse is connected (uncomment if you use an external mouse)
    # Option "DisableWhileMouse" "on"
EndSection
